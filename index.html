<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoClips | Portafolio</title>
    <!-- Cargamos tipografía moderna -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #070f24;          
            --bg-card: #0d1938;          
            --accent-cyan: #00f2fe;      
            --accent-blue: #2563eb;      
            --text-muted: #6b7280;       
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
            text-align: center;
        }

        /* 1. CORRECCIÓN: Contenedor Adaptable a PC y Móvil */
        .wrapper {
            max-width: 1000px; /* Tamaño ideal extendido para pantallas de computadora */
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Ajuste para que en PC el contenido principal no se estire de forma extraña */
        .hero-section, .navigation-box, .top-profile-bar {
            max-width: 550px;
            margin-left: auto;
            margin-right: auto;
        }

        /* 2. CORRECCIÓN: Barra superior ajustada y sin la 'X' */
        .top-profile-bar {
            background: var(--bg-card);
            border-radius: 40px;
            padding: 10px 24px;
            display: flex;
            align-items: center;
            justify-content: center; /* Centrado estético del título */
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-img {
            width: 32px; /* Tamaño ideal y sutil */
            height: 32px;
            border-radius: 50%;
            background: #ffffff;
            object-fit: cover;
        }

        .profile-name {
            font-weight: 900;
            font-size: 1.1rem; /* Tamaño proporcional */
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* 3. CORRECCIÓN: Barra de menú con "Valbuena Creativa" */
        .navigation-box {
            background: rgba(13, 25, 56, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 25px;
            margin: 15px auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
            box-sizing: border-box;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 700;
            opacity: 0.8;
            transition: opacity 0.2s, color 0.2s;
            cursor: pointer;
        }

        .nav-link:hover {
            opacity: 1;
            color: var(--accent-cyan);
        }

        .btn-action-primary {
            background: var(--accent-blue);
            color: #ffffff;
            text-decoration: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 900;
            font-size: 1rem;
            display: block;
            margin-top: 5px;
            letter-spacing: 1px;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: all 0.3s ease;
            cursor: pointer;
        }

        .btn-action-primary:hover {
            background: #1d4ed8;
            box-shadow: 0 4px 20px rgba(0, 242, 254, 0.4);
        }

        /* 4. CORRECCIÓN: Panel Desplegable Interactivo para Contacto */
        .contact-dropdown {
            max-height: 0;
            opacity: 0;
            overflow: hidden;
            transition: max-height 0.5s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
            background: rgba(7, 15, 36, 0.8);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            padding: 0 15px;
        }

        /* Clase activa controlada por JavaScript */
        .contact-dropdown.active {
            max-height: 200px; /* Espacio para deslizarse suavemente */
            opacity: 1;
            padding: 15px;
            margin-top: 10px;
            border: 1px solid rgba(0, 242, 254, 0.2);
        }

        .dropdown-item {
            color: #ffffff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 700;
            padding: 10px;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.03);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .dropdown-item.ig:hover { background: #e1306c; }
        .dropdown-item.wa:hover { background: #25d366; }

        /* Sección Hero */
        .hero-section {
            margin: 40px auto;
        }

        .sub-tag {
            color: #3b82f6;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .brand-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        .software-tag {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #3b82f6;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .brand-main-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        .hero-description {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        .hero-description strong {
            color: #ffffff;
        }

        .hero-buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .btn-pill {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-pill.filled {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-pill.outline {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* Cuadrículas de Galería Adaptables (1 columna móvil / 2 o 3 columnas en PC) */
        .content-panel {
            text-align: left;
            margin-top: 50px;
        }

        .panel-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
        }

        .media-cards-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            justify-items: center;
        }

        .slanted-card {
            width: 100%;
            max-width: 340px;
            height: 190px;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s ease;
            cursor: pointer;
        }

        /* Inclinación sutil responsiva */
        .media-cards-grid .slanted-card:nth-child(1) { transform: rotate(-2deg); }
        .media-cards-grid .slanted-card:nth-child(2) { transform: rotate(2deg); }
        .media-cards-grid .slanted-card:nth-child(3) { transform: rotate(-1deg); }

        .slanted-card:hover {
            transform: rotate(0deg) scale(1.04) !important;
        }

        .card-image-fill {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- 1 y 2. Barra de Perfil Limpia (Sin X) -->
        <div class="top-profile-bar">
            <div class="profile-info">
                <img src="logo.png" alt="Logo" class="avatar-img">
                <span class="profile-name">NEOCLIPS</span>
            </div>
        </div>

        <!-- 3. Menú de Navegación con Botón "Valbuena Creativa" -->
        <div class="navigation-box">
            <a href="#trabajos" class="nav-link">Trabajos</a>
            <a href="#productos" class="nav-link">Productos</a>
            
            <!-- 4. Elemento de Contacto Interactivo -->
            <span id="contactTrigger" class="nav-link">Contacto</span>
            
            <div id="contactDropdown" class="contact-dropdown">
                <a href="https://instagram.com" target="_blank" class="dropdown-item ig">
                    📸 Instagram: @koff_san
                </a>
                <a href="https://wa.me" target="_blank" class="dropdown-item wa">
                    💬 WhatsApp: +58 412-9144496
                </a>
            </div>

            <a href="#productos" class="btn-action-primary">Valbuena Creativa</a>
        </div>
