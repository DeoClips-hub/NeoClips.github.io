<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeoClips | Portafolio</title>
    <!-- Cargamos tipografía moderna similar a la de Solazzo -->
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        /* Variables de color de la referencia */
        :root {
            --bg-dark: #070f24;          /* Fondo azul profundo ultra oscuro */
            --bg-card: #0d1938;          /* Fondo de los bloques y menús */
            --accent-cyan: #00f2fe;      /* Brillo cian */
            --accent-blue: #2563eb;      /* Botón principal azul */
            --text-muted: #6b7280;       /* Gris para etiquetas secundarias */
        }

        body {
            background-color: var(--bg-dark);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            margin: 0;
            padding: 0;
            scroll-behavior: smooth;
            text-align: center;
        }

        /* Contenedor Principal Ajustado a Móviles */
        .wrapper {
            max-width: 480px;
            margin: 0 auto;
            padding: 20px;
            box-sizing: border-box;
        }

        /* 1. Barra Superior con Perfil, Nombre y X Cierre */
        .top-profile-bar {
            background: var(--bg-card);
            border-radius: 40px;
            padding: 8px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 10px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .avatar-img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: #ffffff;
            object-fit: cover;
        }

        .profile-name {
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .close-icon {
            color: #ffffff;
            font-size: 1.2rem;
            cursor: pointer;
            opacity: 0.8;
        }

        /* 2. Menú de Navegación "Glass" Desplegable */
        .navigation-box {
            background: rgba(13, 25, 56, 0.6);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 24px;
            padding: 25px;
            margin: 15px 0;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .nav-link {
            color: #ffffff;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 400;
            opacity: 0.8;
            transition: opacity 0.2s;
        }

        .nav-link:hover {
            opacity: 1;
            color: var(--accent-cyan);
        }

        /* Botón Hablemos Central */
        .btn-action-primary {
            background: var(--accent-blue);
            color: #ffffff;
            text-decoration: none;
            padding: 12px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            display: block;
            margin-top: 10px;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4);
            transition: transform 0.2s;
        }

        .btn-action-primary:hover {
            transform: scale(1.02);
        }

        /* 3. Sección de Presentación (Hero) */
        .hero-section {
            margin: 40px 0;
        }

        .sub-tag {
            color: #3b82f6;
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 15px;
        }

        .brand-title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 20px;
        }

        /* Bloques de software (Ae / Pr / Valbuena) */
        .software-tag {
            background: rgba(37, 99, 235, 0.15);
            border: 1px solid rgba(37, 99, 235, 0.4);
            color: #3b82f6;
            padding: 8px 12px;
            border-radius: 12px;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .brand-main-title {
            font-size: 2.4rem;
            font-weight: 900;
            letter-spacing: 1px;
            margin: 0;
            text-transform: uppercase;
        }

        .hero-description {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            padding: 0 10px;
            margin-bottom: 30px;
        }

        .hero-description strong {
            color: #ffffff;
        }

        /* Botones de Acción Inferiores */
        .hero-buttons-container {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-bottom: 40px;
        }

        .btn-pill {
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 0.9rem;
            text-decoration: none;
            display: inline-block;
            transition: all 0.2s;
        }

        .btn-pill.filled {
            background: var(--accent-blue);
            color: #ffffff;
            box-shadow: 0 4px 15px rgba(37, 99, 235, 0.3);
        }

        .btn-pill.outline {
            background: transparent;
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .btn-pill:hover {
            transform: translateY(-2px);
        }

        /* 4. Galería de Trabajos / Productos (Tarjetas Rotadas Estilo Solazzo) */
        .content-panel {
            text-align: left;
            margin-top: 50px;
        }

        .panel-title {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 20px;
            border-left: 3px solid var(--accent-cyan);
            padding-left: 10px;
        }

        .media-cards-grid {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }

        /* Tarjeta con inclinación idéntica a la imagen */
        .slanted-card {
            width: 100%;
            height: 180px;
            background: #ffffff;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.3s;
            cursor: pointer;
        }

        /* Inclinaciones alternadas sutiles para emular la referencia */
        .media-cards-grid .slanted-card:nth-child(1) { transform: rotate(-3deg); }
        .media-cards-grid .slanted-card:nth-child(2) { transform: rotate(2deg); }
        .media-cards-grid .slanted-card:nth-child(3) { transform: rotate(-2deg); }

        .slanted-card:hover {
            transform: rotate(0deg) scale(1.03) !important;
        }

        .card-image-fill {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
    </style>
</head>
<body>

    <div class="wrapper">

        <!-- 1. Barra de Perfil -->
        <div class="top-profile-bar">
            <div class="profile-info">
                <!-- Tu logo cargará de forma esférica aquí -->
                <img src="logo.png" alt="Logo" class="avatar-img">
                <span class="profile-name">Neoclips</span>
            </div>
            <div class="close-icon">✕</div>
        </div>

        <!-- 2. Menú de Navegación "Glassmorphism" -->
        <div class="navigation-box">
            <a href="#trabajos" class="nav-link">Trabajos</a>
            <a href="#productos" class="nav-link">Valbuena Creativa</a>
            <a href="https://instagram.com" target="_blank" class="nav-link">Contacto</a>
            <a href="#contacto-directo" class="btn-action-primary">Hablemos!</a>
        </div>

        <!-- 3. Sección Principal (Hero) -->
        <div class="hero-section">
            <div class="sub-tag">Editor & Director Creativo</div>
            
            <div class="brand-title-area">
                <div class="software-tag">Vc</div>
                <h2 class="brand-main-title">Neoclips</h2>
                <div class="software-tag">🎬</div>
            </div>

            <p class="hero-description">
                La nueva forma de crear y ver video. <br>
                Contenido corto, <strong>dinámico digital</strong>.
            </p>

            <div class="hero-buttons-container">
                <a href="#trabajos" class="btn-pill filled">Ver Trabajos</a>
                <a href="#productos" class="btn-pill outline">Productos</a>
            </div>
        </div>

        <!-- 4. Galería de Muestras (Trabajos / Portafolio) -->
        <div id="trabajos" class="content-panel">
            <div class="panel-title">Muestras de Edición</div>
            <div class="media-cards-grid">
                
                <!-- Tarjeta de Video 1 -->
                <div class="slanted-card">
                    <img src="https://unsplash.com" alt="Edición de Video" class="card-image-fill">
                </div>

                <!-- Tarjeta de Video 2 -->
                <div class="slanted-card">
                    <img src="https://unsplash.com" alt="Efectos Visuales" class="card-image-fill">
                </div>

            </div>
        </div>

        <!-- 5. Galería de Productos (Valbuena Creativa) -->
        <div id="productos" class="content-panel">
